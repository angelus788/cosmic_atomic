name: cleanup
on:
  schedule:
    - cron: "00 12 * * 0" # Sundays 12:00 UTC, well clear of the daily 06:00 build
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only log what would be deleted"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      # Keeps the newest 15 builds (latest/44 always survive), drops untagged
      # leftovers and the cosign signatures of anything it deletes.
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: cosmic_atomic
          keep-n-tagged: 15
          exclude-tags: latest,44
          delete-untagged: true
          delete-orphaned-images: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
