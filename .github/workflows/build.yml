name: build
on:
  schedule:
    - cron: "00 06 * * *" # daily, to pick up updates to the base image
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cosmic_atomic
  FEDORA_VERSION: "44"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - name: Build image
        run: |
          sudo podman build \
            --pull=always \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.version=${FEDORA_VERSION}.$(date -u +%Y%m%d) \
            -t localhost/cosmic_atomic:raw \
            -f Containerfile .

      # Regroup the image into stable per-package layers so updates only download
      # the packages that actually changed, instead of every layer we rebuilt.
      - name: Rechunk image
        run: |
          sudo podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            quay.io/fedora/fedora-bootc:${FEDORA_VERSION} \
            /usr/libexec/bootc-base-imagectl rechunk \
            localhost/cosmic_atomic:raw "$IMAGE:latest"
          sudo podman rmi localhost/cosmic_atomic:raw
          sudo podman image inspect "$IMAGE:latest" --format '{{len .RootFS.Layers}} layers'
          df -h /

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        env:
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          echo "$REGISTRY_PASSWORD" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in "$FEDORA_VERSION" "$FEDORA_VERSION.$(date -u +%Y%m%d)"; do
            sudo podman tag "$IMAGE:latest" "$IMAGE:$tag"
            sudo podman push "$IMAGE:$tag"
          done
          sudo podman push --digestfile /tmp/digest "$IMAGE:latest"
          echo "DIGEST=$(cat /tmp/digest)" >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'

      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::warning::SIGNING_SECRET is not set; image pushed unsigned"
            exit 0
          fi
          echo "$REGISTRY_PASSWORD" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"
